name: Build ImmortalWrt Xiaomi AX9000

on:
  workflow_dispatch:
  push:
    paths:
      - '.config'
      - 'feeds-extra.conf'
      - 'files/**'
      - 'patches/**'
      - 'tests/**'
      - '驱动文件/**'
      - '.github/workflows/**'

permissions:
  contents: write

env:
  IMMORTALWRT_REPOSITORY: https://github.com/immortalwrt/immortalwrt.git
  IMMORTALWRT_BRANCH: master
  KIDDIN9_FEED: https://github.com/kiddin9/op-packages.git

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip \
            wget xmlto xxd zlib1g-dev zstd

      - name: Clone ImmortalWrt
        shell: bash
        run: |
          git clone --depth=1 --single-branch --filter=blob:none \
            --branch "${IMMORTALWRT_BRANCH}" "${IMMORTALWRT_REPOSITORY}" immortalwrt

      - name: Prepare feeds and files
        shell: bash
        run: |
          cd immortalwrt
          printf '\n' >> feeds.conf.default
          cat "${GITHUB_WORKSPACE}/feeds-extra.conf" >> feeds.conf.default
          ./scripts/feeds update -a
          # Installing every package from kiddin9 makes Kconfig parse unrelated,
          # incompatible package definitions. Install only this image's packages
          # and the feed-provided dependencies they require.
          ./scripts/feeds install -p packages bash cgi-io curl dawn lua ruby unzip
          ./scripts/feeds install -p luci \
            luci luci-light luci-app-firewall luci-app-package-manager \
            luci-base luci-compat luci-lua-runtime \
            luci-lib-base luci-lib-ip luci-lib-jsonc luci-lib-nixio luci-lib-uqr \
            luci-mod-admin-full luci-mod-network luci-mod-status luci-mod-system \
            luci-proto-batman-adv luci-proto-ipv6 luci-proto-ppp luci-theme-bootstrap
          # batman-adv and batctl moved from openwrt/routing to openwrt/packages.
          ./scripts/feeds install -p ow_packages batctl-default kmod-batman-adv
          # The current ImmortalWrt feed metadata can omit these Kiddin9 package
          # entries after scanning unrelated packages. Link only the packages
          # used by this image, matching the layout produced by scripts/feeds.
          kiddin9_packages=(
            lucky luci-app-lucky luci-app-openclash luci-app-easymesh luci-app-advancedplus
            filebrowser luci-app-filebrowser vsftpd luci-app-vsftpd luci-app-autoreboot
          )
          mkdir -p package/feeds/kiddin9
          for package in "${kiddin9_packages[@]}"; do
            test -f "feeds/kiddin9/$package/Makefile"
            ln -sf "../../../feeds/kiddin9/$package" "package/feeds/kiddin9/$package"
          done
          test -f feeds/luci/modules/luci-base/po/zh_Hans/base.po
          test -f feeds/luci/applications/luci-app-firewall/po/zh_Hans/firewall.po
          test -f feeds/luci/applications/luci-app-package-manager/po/zh_Hans/package-manager.po
          patch --forward --batch -p1 -d feeds/kiddin9/luci-app-easymesh \
            < "${GITHUB_WORKSPACE}/patches/luci-app-easymesh-lan-bridge-loop.patch"
          easymesh_init='feeds/kiddin9/luci-app-easymesh/root/etc/init.d/easymesh'
          easymesh_cbi='feeds/kiddin9/luci-app-easymesh/luasrc/model/cbi/easymesh.lua'
          easymesh_defaults='feeds/kiddin9/luci-app-easymesh/root/etc/config/easymesh'
          test -f "$easymesh_init"
          sh -n "$easymesh_init"
          grep -Fq 'find_mesh_bridge' "$easymesh_init"
          grep -Fq "bridge_loop_avoidance='1'" "$easymesh_init"
          grep -Fq 'network.$bridge.stp=1' "$easymesh_init"
          ! grep -Fq 'network.@device[0]' "$easymesh_init"
          grep -Fq 'MESH LAN bridge' "$easymesh_cbi"
          grep -Fq "option bridge_device 'br-lan'" "$easymesh_defaults"
          for package in "${kiddin9_packages[@]}"; do
            test -L "package/feeds/kiddin9/$package"
          done
          sh "${GITHUB_WORKSPACE}/tests/test-easymesh-bridge.sh" "$easymesh_init"
          cp -a "${GITHUB_WORKSPACE}/files/." files/
          cp "${GITHUB_WORKSPACE}/.config" .config

      - name: Configure target and packages
        shell: bash
        run: |
          cd immortalwrt
          make defconfig
          require_config() {
            grep -qx "$1" .config || {
              echo "Missing expected config: $1" >&2
              exit 1
            }
          }
          require_config 'CONFIG_TARGET_qualcommax_ipq807x=y'
          require_config 'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax9000-stock=y'
          require_config 'CONFIG_LUCI_LANG_zh_Hans=y'
          require_config 'CONFIG_PACKAGE_luci-app-package-manager=y'
          require_config 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y'
          require_config 'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y'
          require_config 'CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y'
          require_config 'CONFIG_PACKAGE_luci-i18n-filebrowser-zh-cn=y'
          require_config 'CONFIG_PACKAGE_luci-i18n-vsftpd-zh-cn=y'
          require_config 'CONFIG_PACKAGE_luci-i18n-autoreboot-zh-cn=y'
          require_config 'CONFIG_PACKAGE_luci-app-openclash=y'
          require_config 'CONFIG_PACKAGE_luci-app-easymesh=y'
          require_config 'CONFIG_PACKAGE_luci-app-lucky=y'
          require_config 'CONFIG_PACKAGE_luci-app-advancedplus=y'
          require_config 'CONFIG_PACKAGE_luci-proto-batman-adv=y'
          require_config 'CONFIG_PACKAGE_kmod-batman-adv=y'
          require_config 'CONFIG_BATMAN_ADV_BLA=y'
          require_config 'CONFIG_PACKAGE_wpad-mbedtls=y'
          require_config 'CONFIG_PACKAGE_filebrowser=y'
          require_config 'CONFIG_PACKAGE_luci-app-filebrowser=y'
          require_config 'CONFIG_PACKAGE_vsftpd=y'
          require_config 'CONFIG_PACKAGE_luci-app-vsftpd=y'
          require_config 'CONFIG_PACKAGE_luci-app-autoreboot=y'
          require_config 'CONFIG_FEED_kiddin9=m'
          require_config 'CONFIG_FEED_ow_packages=m'
          require_config 'CONFIG_FEED_video=m'
          sh -n files/etc/uci-defaults/99-xiaomi-ax9000
          grep -Fqx "uci -q set network.lan.ipaddr='192.168.3.9/24'" \
            files/etc/uci-defaults/99-xiaomi-ax9000
          grep -Fqx "uci -q set luci.main.lang='zh_cn'" \
            files/etc/uci-defaults/99-xiaomi-ax9000
          grep -Fqx "uci -q set wireless.radio3.htmode='HE160'" \
            files/etc/uci-defaults/99-xiaomi-ax9000
          grep -Fqx "uci -q set wireless.radio3.channel='36'" \
            files/etc/uci-defaults/99-xiaomi-ax9000
          grep -Fqx "uci -q set firewall.\${ftp_rule}.dest_port='21 50000-51000'" \
            files/etc/uci-defaults/99-xiaomi-ax9000
          test ! -e files/lib/firmware/ath11k/IPQ8074/hw2.0/board-2.bin
          cmp -s "${GITHUB_WORKSPACE}/驱动文件/board-2.bin" \
            files/lib/firmware/ath11k/QCN9074/hw1.0/board-2.bin

      - name: Download sources
        shell: bash
        run: |
          cd immortalwrt
          make download -j"$(nproc)" V=s

      - name: Build firmware
        shell: bash
        run: |
          cd immortalwrt
          make -j"$(nproc)" V=s

      - name: Verify and collect firmware
        shell: bash
        run: |
          cd immortalwrt
          board_file="$(find staging_dir/target-*/root-*/lib/firmware/ath11k/QCN9074/hw1.0 \
            -name board-2.bin -print -quit)"
          test -n "$board_file"
          echo '971f8e59692f711c02ea8658b34f1c3821e03bfd2f89c19cd06fd02e97c862be  '"$board_file" | sha256sum -c -
          repositories_file="$(find staging_dir/target-*/root-*/etc/apk/repositories.d -name distfeeds.list -print -quit)"
          test -n "$repositories_file"
          ! grep -E '^[^#].*/(kiddin9|ow_packages|video)/packages\.adb$' "$repositories_file"
          grep -E '^#.*packages/[^/]+/(kiddin9|ow_packages|video)/packages\.adb$' "$repositories_file"
          target_dir="bin/targets/qualcommax/ipq807x"
          test -d "${target_dir}"
          test -n "$(find "${target_dir}" -maxdepth 1 -type f -name '*xiaomi_ax9000-stock*' -print -quit)"
          mkdir -p "${GITHUB_WORKSPACE}/firmware"
          find "${target_dir}" -maxdepth 1 -type f \
            \( -name '*xiaomi_ax9000-stock*' -o -name 'sha256sums' \) \
            -exec cp -v {} "${GITHUB_WORKSPACE}/firmware/" \;

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-xiaomi-ax9000-stock
          path: firmware/
          if-no-files-found: error
          compression-level: 0

      - name: Publish firmware release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "${tag}" firmware/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ImmortalWrt Xiaomi AX9000 build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated ImmortalWrt build for Xiaomi AX9000 stock layout."
